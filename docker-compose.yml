version: '3.8'

services:
  copypaste-app:
    image: cfpandrade/copypaste_locally:latest
    container_name: copypaste-locally
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - copypaste_data:/app
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "app.version=latest"
      - "app.features=dark-mode,search-replace,typing-indicators,chat,mobile-responsive,drag-drop,notifications,sounds"

volumes:
  copypaste_data: