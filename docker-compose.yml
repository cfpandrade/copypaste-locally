# Compose del servidor: usa la imagen que GitHub publica al fusionar a main,
# de modo que actualizar es pulsar Update en Dockge.
#
# Para desarrollar en local, usa docker-compose.dev.yml, que construye desde
# este mismo código sin publicar nada.
services:
  copypaste-app:
    image: ghcr.io/cfpandrade/copypaste-locally:latest
    container_name: copypaste-locally
    restart: unless-stopped
    ports:
      # La aplicación escucha en el 3000; el 4000 es el puerto del servidor.
      - 4000:3000
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/datos
    volumes:
      # Solo los datos. Montar aquí /app taparía el código de la imagen, que es
      # justo lo que impedía que las mejoras llegaran al contenedor.
      - copypaste_datos:/datos
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  copypaste_datos:
