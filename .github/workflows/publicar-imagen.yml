# Publica la imagen cuando algo llega a main.
#
# En la rama dev no se publica nada: ahí se trabaja y se prueba en local. La
# imagen solo se genera al fusionar a main, y entonces basta con pulsar Update
# en Dockge para que el servidor se quede con la versión nueva.

name: Publicar imagen

on:
  push:
    branches: [main]
    # Cambiar el README no justifica reconstruir la imagen.
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch: {}

env:
  IMAGEN: ghcr.io/${{ github.repository_owner }}/copypaste-locally

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Identificarse en el registro
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar el constructor
        uses: docker/setup-buildx-action@v3

      - name: Leer la versión
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # latest es la que usa el servidor; la versión (package.json) es la que despliega Gilfoyle en el CT117,
          # y la del commit permite volver a un punto concreto si algo sale mal.
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGEN }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          echo "### Imagen publicada" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '`${{ env.IMAGEN }}:latest`, `${{ env.IMAGEN }}:${{ steps.version.outputs.version }}`' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "La despliega Gilfoyle en el CT117." >> $GITHUB_STEP_SUMMARY
