# Publica la imagen cuando algo llega a main.
#
# En la rama dev no se publica nada. Al fusionar a main se publica en ghcr (latest, la versión y el commit).
# Con una etiqueta vX.Y.Z que apunta a main y coincide con package.json se crea además una Release pública con la
# imagen como archivo OCI, su sha256 y su firma de procedencia (bundle de sigstore): se baja y se verifica sin clave.

name: Publicar imagen

# Nunca en pull_request ni a mano: el repositorio es público y solo se construye lo que llega a main.
on:
  push:
    branches: [main]
    tags: ['v*', '3.*']
    # Cambiar el README no justifica reconstruir la imagen.
    paths-ignore:
      - '**.md'
      - '.gitignore'

env:
  IMAGEN: ghcr.io/${{ github.repository_owner }}/copypaste-locally

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # para firmar la procedencia de la imagen (attestation de GitHub): se comprueba con
      # gh attestation verify oci://ghcr.io/cfpandrade/copypaste-locally:<versión> --owner cfpandrade
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - name: Identificarse en el registro
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar el constructor
        uses: docker/setup-buildx-action@v3

      - name: Leer la versión
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Construir y publicar
        id: construir
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # latest es la que usa el servidor; la versión (package.json) es la que despliega Gilfoyle en el CT117,
          # y la del commit permite volver a un punto concreto si algo sale mal.
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGEN }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Firmar la procedencia
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGEN }}
          subject-digest: ${{ steps.construir.outputs.digest }}
          push-to-registry: true

      - name: Resumen
        run: |
          echo "### Imagen publicada" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '`${{ env.IMAGEN }}:latest`, `${{ env.IMAGEN }}:${{ steps.version.outputs.version }}`' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "La despliega Gilfoyle en el CT117." >> $GITHUB_STEP_SUMMARY

  release:
    # solo con una etiqueta de versión; la etiqueta la crea el propietario (las reglas no dejan a nadie más)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # crear la Release
      id-token: write        # firmar el archivo
      attestations: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comprobar que la etiqueta es de main y de esta versión
        id: version
        run: |
          v=$(jq -r .version package.json)
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "La etiqueta $GITHUB_REF_NAME no es v$v (package.json)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "La etiqueta no apunta a un commit de main"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "fichero=copypaste-locally-$v.oci.tar" >> "$GITHUB_OUTPUT"

      - name: Preparar el constructor
        uses: docker/setup-buildx-action@v3

      - name: Construir el archivo OCI
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ env.IMAGEN }}:${{ steps.version.outputs.version }}
          outputs: type=oci,dest=${{ steps.version.outputs.fichero }}
          cache-from: type=gha

      - name: Calcular el sha256
        run: sha256sum "${{ steps.version.outputs.fichero }}" > "${{ steps.version.outputs.fichero }}.sha256"

      - name: Firmar la procedencia del archivo
        id: firma
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.version.outputs.fichero }}

      - name: Crear la Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
          F: ${{ steps.version.outputs.fichero }}
        run: |
          cp "${{ steps.firma.outputs.bundle-path }}" "copypaste-locally-$V.sigstore.json"
          cat > notas.md <<NOTAS
          CopyPaste $V as an OCI image archive, built from \`main\` ($GITHUB_SHA) by this repository's workflow.

          sha256: \`$(cut -d' ' -f1 "$F.sha256")\`

          Verify it (no GitHub account needed):

          \`\`\`bash
          sha256sum -c $F.sha256
          cosign verify-blob-attestation --new-bundle-format --type slsaprovenance1 \\
            --bundle copypaste-locally-$V.sigstore.json \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/publicar-imagen.yml@$GITHUB_REF" \\
            $F
          \`\`\`

          Load it with \`docker load -i $F\` or \`skopeo copy oci-archive:$F docker-daemon:copypaste-locally:$V\`.
          NOTAS
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "CopyPaste $V" --notes-file notas.md \
            "$F" "$F.sha256" "copypaste-locally-$V.sigstore.json"
